<text x="360" y="121" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" text-anchor="middle" font-size="32" fill="#647c70">×</text>
<text x="386" y="385" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" text-anchor="middle" font-size="14" fill="#647c70">Support</text>
