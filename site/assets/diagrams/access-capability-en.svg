<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="29" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#56746a">X-LAB AI / AI FOR ALL / 01</text>
<text x="20" y="64" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="25" font-weight="600" fill="#112d22">Two forces, working together</text>
<path d="M20 86 H700" fill="none" stroke="#dbe5df"/>
<g transform="translate(0,105)">
<path class="concept-edge" data-from="open" data-to="outcome" d="M167.5 177 V213 H360 V247" fill="none" stroke="#8ba299" stroke-width="1.4" marker-end="url(#access-capability-en-desktop-arrow)"/>
<path class="concept-edge" data-from="people" data-to="outcome" d="M552.5 177 V213 H360" fill="none" stroke="#8ba299" stroke-width="1.4"/>
