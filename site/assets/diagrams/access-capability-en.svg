<text x="552.5" y="93" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#153126">Capable use</text>
<text x="552.5" y="119" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="13" text-anchor="middle" fill="#536c5f">Learning, judgment and creativity</text>
<text x="552.5" y="139" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="13" text-anchor="middle" fill="#536c5f">From tools to real problems</text>
</g>
