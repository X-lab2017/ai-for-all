<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 718" width="720" height="718" role="img" aria-labelledby="title desc">
<title id="title">Two forces, working together</title><desc id="desc">Open source lowers barriers; human development unlocks creativity. Data and evaluation support both.</desc>
