<text x="360.0" y="303" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#153126">AI for All</text>
<text x="360.0" y="329" font-family="Arial, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="13" text-anchor="middle" fill="#536c5f">More people can access, learn and create</text>
