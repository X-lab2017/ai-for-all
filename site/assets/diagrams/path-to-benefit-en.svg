<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 618" width="720" height="618" role="img" aria-labelledby="title desc">
<title id="title">From developers to wider public benefit</title><desc id="desc">Developer growth reaches more people through useful applications, guided by needs and feedback.</desc>
